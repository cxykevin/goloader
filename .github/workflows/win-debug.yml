name: windows loader tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: win-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GO111MODULE: "on"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Environment
        run: |
          go version
          go env GOOS GOARCH GOROOT
          [System.Environment]::OSVersion.VersionString

      - name: Prepare cmd/objfile
        run: |
          $goroot = (go env GOROOT).Trim()
          $dst = Join-Path $goroot "src\cmd\objfile"
          if (-not (Test-Path $dst)) {
            Copy-Item -Recurse (Join-Path $goroot "src\cmd\internal") $dst
          }
          Test-Path $dst

      - name: Build
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit 1 }
          go build -o loader.exe ./examples/loader
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\loader.exe -h 2>&1 | Select-Object -First 3

      - name: Examples
        run: |
          $repo = (Get-Location).Path
          & .\.github\wintest\run-examples.ps1 -Repo $repo -Work "$env:RUNNER_TEMP\goloader-win"
          if (-not $?) { exit 1 }

      - name: Deep tests
        run: |
          $repo = (Get-Location).Path
          & .\.github\wintest\run-deep.ps1 -Repo $repo -Work "$env:RUNNER_TEMP\goloader-deep"
          if (-not $?) { exit 1 }
